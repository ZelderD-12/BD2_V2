services:
  # =============================================
  # SQL SERVER 2022 Express + init automático
  # =============================================
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile.sqlserver
    container_name: clinica_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-ClinicaDBgrupo3#}
      MSSQL_PID: "Express"
    ports:
      - "${SQLSERVER_PORT:-1436}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql/backup:/var/opt/mssql/backup
      - ./scripts:/scripts
    networks:
      - clinica_network
    restart: unless-stopped

  # =============================================
  # BACKEND (Bun / Elysia)
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica_backend
    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: ${SA_PASSWORD:-ClinicaDBgrupo3#}
      DB_NAME: ClinicaF
      APP_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - clinica_network
    restart: unless-stopped

  # =============================================
  # FRONTEND (React + Vite)
  # =============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clinica_frontend
    environment:
      VITE_API_URL: http://backend:8080
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - clinica_network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  clinica_network:
    driver: bridge
